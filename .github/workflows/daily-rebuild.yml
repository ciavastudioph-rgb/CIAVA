name: Daily rebuild trigger

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update rebuild marker
        run: date -u "+%Y-%m-%dT%H:%M:%SZ" > .netlify-rebuild-marker

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .netlify-rebuild-marker
          git diff --staged --quiet || git commit -m "chore: daily rebuild trigger"
          git push
